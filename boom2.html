<!DOCTYPE html>
<html lang="zh-CN">
<!-- FROM z.ai-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绚烂烟花倒计时 - 音控版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 禁止选中文本，提升体验 */
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 画布 */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        /* 右上角静音按钮 */
        .mute-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .mute-btn:active {
            transform: scale(0.95);
        }

        /* 开启音效提示 */
        .audio-hint {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            transition: opacity 0.5s;
            white-space: nowrap;
        }

        /* 内容区域 */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            min-width: 120px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transform: skew(-5deg);
            transition: all 0.3s ease;
        }
        
        .time-box:hover {
            transform: skew(-5deg) scale(1.1);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 50px rgba(255,255,255,0.2);
        }

        .number {
            font-size: 4rem;
            font-weight: 800;
            display: block;
            color: #fff;
            text-shadow: 0 0 10px currentColor;
            line-height: 1;
        }

        .label {
            font-size: 1rem;
            margin-top: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .new-year-message {
            display: none;
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00cc, #3333ff, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shake 0.5s infinite;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #fff; }
            to { text-shadow: 0 0 40px #ff00de, 0 0 60px #00ffde; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .number { font-size: 2.5rem; }
            .time-box { min-width: 80px; padding: 15px; }
            .new-year-message { font-size: 3rem; }
            .mute-btn { width: 40px; height: 40px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- 音效提示 -->
    <div class="audio-hint" id="audio-hint">👆 点击页面任意处开启震撼音效</div>

    <!-- 右上角静音开关 -->
    <div class="mute-btn" id="mute-btn" title="开关音效">🔇</div>

    <canvas id="canvas"></canvas>

    <div class="content">
        <h1 id="title">迎接新年</h1>
        
        <div class="countdown-container" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">天</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">时</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">分</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">秒</span>
            </div>
        </div>

        <div class="new-year-message" id="message">新年快乐!</div>
    </div>

    <script>
        // --- 倒计时逻辑 ---
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownContainer = document.getElementById('countdown');
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const audioHint = document.getElementById('audio-hint');
        const muteBtn = document.getElementById('mute-btn');

        let isNewYear = false;

        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const nextYear = currentYear + 1;
            const targetDate = new Date(`January 1, ${nextYear} 00:00:00`).getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                if (!isNewYear) {
                    isNewYear = true;
                    countdownContainer.style.display = 'none';
                    titleEl.style.display = 'none';
                    messageEl.style.display = 'block';
                    launchAutoFireworks(true); // 疯狂模式
                }
                return;
            }

            const d = Math.floor(diff / 1000 / 60 / 60 / 24);
            const h = Math.floor((diff / 1000 / 60 / 60) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            daysEl.innerText = d < 10 ? '0' + d : d;
            hoursEl.innerText = h < 10 ? '0' + h : h;
            minutesEl.innerText = m < 10 ? '0' + m : m;
            secondsEl.innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);

        // --- 音频控制逻辑 ---
        let audioCtx;
        let isAudioInitialized = false; // 是否已初始化
        let isMuted = true; // 默认静音（等待点击）

        // 初始化音频上下文（必须在用户点击后调用）
        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioInitialized = true;
            isMuted = false; // 初始化后自动开启
            updateMuteIcon();
            
            // 隐藏提示
            audioHint.style.opacity = 0;
        }

        function updateMuteIcon() {
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        // 播放发射声
        function playLaunchSound() {
            if (!isAudioInitialized || isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // 播放爆炸声
        function playExplosionSound() {
            if (!isAudioInitialized || isMuted) return;
            const bufferSize = audioCtx.sampleRate * 1.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        // --- 烟花视觉引擎 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let cw = window.innerWidth;
        let ch = window.innerHeight;

        function setCanvasSize() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        let fireworks = [];
        let particles = [];

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function calculateDistance(p1x, p1y, p2x, p2y) {
            let xDistance = p1x - p2x;
            let yDistance = p1y - p2y;
            return Math.sqrt(Math.pow(xDistance, 2) + Math.pow(yDistance, 2));
        }

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx;
                this.y = sy;
                this.sx = sx;
                this.sy = sy;
                this.tx = tx;
                this.ty = ty;
                this.distanceToTarget = calculateDistance(sx, sy, tx, ty);
                this.distanceTraveled = 0;
                
                this.coordinates = [];
                this.coordinateCount = 4;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                this.angle = Math.atan2(ty - sy, tx - sx);
                this.speed = 2;
                this.acceleration = 1.05;
                
                this.hue = random(0, 360); 
                this.brightness = random(50, 70);
                
                playLaunchSound();
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);

                this.speed *= this.acceleration;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;

                this.distanceTraveled = calculateDistance(this.sx, this.sy, this.x + vx, this.y + vy);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.tx, this.ty, this.hue);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.lineWidth = 3;
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                this.angle = random(0, Math.PI * 2);
                this.speed = random(1, 15); 
                
                this.friction = 0.94;
                this.gravity = 1.2;
                
                this.hue = random(hue - 20, hue + 20);
                this.brightness = random(50, 80);
                this.alpha = 1;
                this.decay = random(0.01, 0.02); 
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                
                this.alpha -= this.decay;
                
                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let particleCount = 100; 
            while (particleCount--) {
                particles.push(new Particle(x, y, hue));
            }
            
            playExplosionSound();

            // 闪光特效
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.arc(x, y, 100, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
        }

        // 动画主循环
        function loop() {
            requestAnimationFrame(loop);
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.fillRect(0, 0, cw, ch);
            
            ctx.globalCompositeOperation = 'lighter';

            let i = fireworks.length;
            while (i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            let j = particles.length;
            while (j--) {
                particles[j].draw();
                particles[j].update(j);
            }

            launchAutoFireworks();
        }

        // --- 交互与控制 ---
        let timerTick = 0;
        let timerTotal = 50;
        let intenseMode = false;

        function launchAutoFireworks(force = false) {
            if (isNewYear) intenseMode = true;
            
            if (timerTick >= timerTotal || force) {
                if (!intenseMode) {
                    fireworks.push(new Firework(cw / 2, ch, random(0, cw), random(0, ch / 2)));
                    timerTick = 0;
                    timerTotal = random(20, 60); 
                } else {
                    fireworks.push(new Firework(random(0, cw), ch, random(0, cw), random(0, ch / 2)));
                    fireworks.push(new Firework(random(0, cw), ch, random(0, cw), random(0, ch / 2)));
                    fireworks.push(new Firework(random(0, cw), ch, random(0, cw), random(0, ch / 2)));
                    timerTick = 0;
                    timerTotal = 10;
                }
            } else {
                timerTick++;
            }
        }

        // 1. 页面加载立即开始动画（视觉）
        loop();
        updateCountdown();

        // 2. 首次点击事件：开启音频
        // 使用 { once: true } 确保只触发一次
        document.body.addEventListener('click', function enableAudio() {
            initAudio();
            document.body.removeEventListener('click', enableAudio);
        }, { once: true });
        
        document.body.addEventListener('touchstart', function enableAudioTouch() {
            initAudio();
            document.body.removeEventListener('touchstart', enableAudioTouch);
        }, { once: true });

        // 3. 静音按钮事件
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止冒泡，防止触发body的点击（虽然body只触发一次，但这是好习惯）
            
            if (!isAudioInitialized) {
                // 如果还没初始化，点击静音按钮也视为初始化
                initAudio();
            } else {
                isMuted = !isMuted;
                updateMuteIcon();
            }
        });

        // 4. 画布点击放烟花
        canvas.addEventListener('mousedown', function(e) {
            e.preventDefault();
            fireworks.push(new Firework(cw / 2, ch, e.clientX, e.clientY));
        });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                fireworks.push(new Firework(cw / 2, ch, e.touches[i].clientX, e.touches[i].clientY));
            }
        });

    </script>
</body>
</html>
