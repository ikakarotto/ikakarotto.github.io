<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国际黄金 XAU/USD 实时价格</title>
  <style>
    /* ============================================================
       CSS 自定义属性 — 统一配色，后续主题切换只改这里
       使用深色金融风格：深底色 + 金色强调
    ============================================================ */
    :root {
      --bg-page:       #0d0f14;
      --bg-header:     #12151c;
      --bg-footer:     #12151c;
      --border-color:  #1e2330;
      --gold:          #c9a84c;
      --gold-light:    #e8c86a;
      --gold-dim:      #7a6228;
      --text-primary:  #e8e2d4;
      --text-secondary:#8a8070;
      --text-muted:    #4a4540;
      --green:         #3daa74;
      --red:           #e05c5c;
      --font-display:  'Georgia', 'Times New Roman', serif;
      --font-body:     'Helvetica Neue', 'Arial', sans-serif;
      --radius:        6px;
      --header-h:      64px;
      --footer-h:      56px;
    }

    /* ============================================================
       全局重置：避免浏览器默认 margin/padding 干扰布局
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       整体布局：flex 纵向排列，图表区填满剩余高度
    ============================================================ */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 500px;
    }

    /* ────────── Header ────────── */
    .header {
      flex: 0 0 var(--header-h);
      height: var(--header-h);
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 左侧装饰竖线，金色 */
    .header-left::before {
      content: '';
      display: block;
      width: 3px;
      height: 28px;
      background: linear-gradient(to bottom, var(--gold-light), var(--gold-dim));
      border-radius: 2px;
      flex-shrink: 0;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* 右侧：加载状态徽章 */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: transparent;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: border-color 0.3s, color 0.3s;
    }

    /* 状态指示圆点 */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    /* 加载中：黄色闪烁 */
    .status-badge.loading .status-dot {
      background: var(--gold);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .status-badge.loading { border-color: var(--gold-dim); color: var(--gold); }

    /* 加载成功：绿色稳定亮 */
    .status-badge.ok .status-dot { background: var(--green); }
    .status-badge.ok { border-color: #1e3d2d; color: var(--green); }

    /* 加载失败：红色 */
    .status-badge.error .status-dot { background: var(--red); }
    .status-badge.error { border-color: #3d1e1e; color: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ────────── 图表区 ────────── */
    .chart-section {
      flex: 1 1 0;
      min-height: 0;        /* 必须，让 flex 子项可以收缩到父容器以内 */
      position: relative;
    }

    /* TradingView Widget 的外层容器需要 100% 高宽才能 autosize 生效 */
    .tradingview-widget-container {
      height: 100%;
      width: 100%;
    }

    /* Widget 内部图表区，减去底部版权行高度 32px */
    .tradingview-widget-container__widget {
      height: calc(100% - 32px);
      width: 100%;
    }

    /* TradingView 版权行样式微调 */
    .tradingview-widget-copyright {
      background: var(--bg-page);
      padding: 6px 12px;
      font-size: 11px;
    }
    .tradingview-widget-copyright a { color: var(--text-muted); text-decoration: none; }
    .tradingview-widget-copyright a:hover { color: var(--text-secondary); }
    .tradingview-widget-copyright .blue-text { color: var(--text-muted); }
    .tradingview-widget-copyright .trademark { color: var(--text-muted); }

    /* ────────── 错误提示层 ────────── */
    /* 覆盖在图表区上方，仅在 JS 检测到超时时显示 */
    .error-overlay {
      display: none;           /* 默认隐藏，JS 控制 display */
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .error-icon {
      font-size: 40px;
      line-height: 1;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--text-primary);
    }

    .error-desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 400px;
    }

    .retry-btn {
      margin-top: 4px;
      padding: 8px 22px;
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      background: transparent;
      color: var(--gold);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .retry-btn:hover {
      background: var(--gold-dim);
      color: var(--bg-page);
    }

    /* ────────── Footer ────────── */
    .footer {
      flex: 0 0 var(--footer-h);
      height: var(--footer-h);
      background: var(--bg-footer);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-left {
      font-size: 11px;
      color: var(--text-muted);
    }

    .footer-right {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
    }

    .footer-right a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .footer-right a:hover { color: var(--text-secondary); }

    /* ────────── 响应式：移动端 ────────── */
    @media (max-width: 600px) {
      .header-title  { font-size: 15px; }
      .header-subtitle { display: none; }   /* 小屏隐藏副标题节省空间 */
      .footer        { flex-direction: column; height: auto; padding: 10px 16px; gap: 4px; }
      .footer-right  { text-align: left; }
    }
  </style>
</head>
<body>

<!-- noscript：当浏览器禁用 JS 时显示，正常情况下不可见 -->
<noscript>
  <div style="padding:40px;text-align:center;font-family:sans-serif;color:#c9a84c;background:#0d0f14;">
    ⚠️ 此页面需要启用 JavaScript 才能加载行情图表，请在浏览器设置中允许脚本后刷新。
  </div>
</noscript>

<div class="layout">

  <!-- ══════════════════ 顶部信息区 ══════════════════ -->
  <header class="header">
    <div class="header-left">
      <div>
        <div class="header-title">国际黄金 XAU/USD 实时价格</div>
        <div class="header-subtitle">Gold Spot · 数据由 TradingView 提供</div>
      </div>
    </div>

    <!-- 加载状态徽章，JS 动态更新 class 和文字 -->
    <div class="status-badge loading" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">图表加载中…</span>
    </div>
  </header>

  <!-- ══════════════════ 图表区 ══════════════════ -->
  <main class="chart-section" id="chartSection">

    <!-- 错误提示层：默认隐藏，超时后由 JS 显示 -->
    <div class="error-overlay" id="errorOverlay">
      <div class="error-icon">📡</div>
      <div class="error-title">行情图表加载失败</div>
      <div class="error-desc">
        无法连接至 TradingView 行情服务。<br>
        请检查网络连接，或确认该服务在您的网络环境中可访问。
      </div>
      <button class="retry-btn" onclick="retryLoad()">重新加载</button>
    </div>

    <!-- TradingView Advanced Chart Widget BEGIN -->
    <div class="tradingview-widget-container" id="tvContainer">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/symbols/XAUUSD/?utm_source=gold-chart&utm_medium=widget_new&utm_campaign=advanced-chart"
           rel="noopener nofollow" target="_blank">
          <span class="blue-text">XAU/USD 图表</span>
        </a>
        <span class="trademark"> by TradingView</span>
      </div>
      <!--
        Widget 配置说明：
        - symbol: OANDA:XAUUSD — OANDA 提供的黄金兑美元现货，数据稳定
        - autosize: true — 图表填满容器，需外层有明确高度（由 CSS flex 保证）
        - style: "3" — Basic Area Chart，曲线风格最直观
        - interval: "5" — 5 分钟粒度，适合实时走势观察
        - theme: "dark" — 与页面深色背景保持一致
        - locale: "zh_CN" — 中文界面
        - hide_top_toolbar: false — 保留工具栏，允许用户切换时间粒度
      -->
      <script type="text/javascript"
              src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
              async
              id="tvScript">
      {
        "autosize": true,
        "symbol": "OANDA:XAUUSD",
        "interval": "5",
        "timezone": "Asia/Shanghai",
        "theme": "dark",
        "style": "3",
        "locale": "zh_CN",
        "backgroundColor": "rgba(13, 15, 20, 1)",
        "hide_top_toolbar": false,
        "save_image": false,
        "calendar": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
    <!-- TradingView Advanced Chart Widget END -->

  </main>

  <!-- ══════════════════ 底部说明区 ══════════════════ -->
  <footer class="footer">
    <div class="footer-left">
      数据来源：TradingView · OANDA:XAUUSD · 价格仅供参考，不构成投资建议
    </div>
    <div class="footer-right">
      © 2026 &nbsp;·&nbsp;
      <a href="https://www.tradingview.com/symbols/XAUUSD/" rel="noopener nofollow" target="_blank">
        在 TradingView 查看完整图表
      </a>
    </div>
  </footer>

</div><!-- /.layout -->

<script>
  /**
   * 更新顶部状态徽章的显示状态
   *
   * @param {'loading'|'ok'|'error'} state - 当前状态类型
   * @param {string} text - 要显示的状态文字
   * @returns {void}
   */
  function setStatus(state, text) {
    var badge = document.getElementById('statusBadge');
    var label = document.getElementById('statusText');
    // 先清除所有状态 class，再添加新的，避免多个状态 class 并存
    badge.classList.remove('loading', 'ok', 'error');
    badge.classList.add(state);
    label.textContent = text;
  }

  /**
   * 显示错误提示层，并将状态更新为 error
   * 单独封装是因为"显示覆盖层"和"更新状态"需要同步执行，
   * 方便后续重试逻辑复用
   *
   * @returns {void}
   */
  function showError() {
    setStatus('error', '加载失败');
    var overlay = document.getElementById('errorOverlay');
    // 切换为 flex 而非 block，是因为 error-overlay 用 flex 居中布局
    overlay.style.display = 'flex';
  }

  /**
   * 重新加载页面以重试图表加载
   * 直接 reload 是最简单可靠的重试方式；
   * 如果只重建 script 标签，TradingView Widget 内部状态可能残留，导致重试无效
   *
   * @returns {void}
   */
  function retryLoad() {
    window.location.reload();
  }

  /**
   * 检测 TradingView Widget 是否在超时时间内成功渲染
   *
   * TradingView Widget 通过异步脚本加载并在容器内生成 iframe，
   * 因此无法用 script.onload 直接判断渲染完成；
   * 这里通过轮询 iframe 是否存在来判断是否加载成功。
   *
   * @param {number} timeoutMs - 等待超时毫秒数，超过后认为加载失败
   * @param {number} checkIntervalMs - 每次轮询的间隔毫秒数
   * @returns {void}
   */
  function watchWidgetLoad(timeoutMs, checkIntervalMs) {
    var startTime = Date.now();

    var timer = setInterval(function () {
      var container = document.getElementById('tvContainer');
      // iframe 出现即认为 Widget 已成功初始化
      var iframe = container ? container.querySelector('iframe') : null;

      if (iframe) {
        clearInterval(timer);
        setStatus('ok', '行情实时更新中');
        return;
      }

      // 超出等待时间仍未出现 iframe，视为加载失败
      if (Date.now() - startTime > timeoutMs) {
        clearInterval(timer);
        showError();
      }
    }, checkIntervalMs);
  }

  // 页面完成 DOM 解析后开始监听，等待最多 12 秒，每 500ms 轮询一次
  document.addEventListener('DOMContentLoaded', function () {
    watchWidgetLoad(12000, 500);
  });
</script>

</body>
</html>
